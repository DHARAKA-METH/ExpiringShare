AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ExpiringShare Milestone 1

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 3
    MemorySize: 128

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/helloWorld.lambdaHandler
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get