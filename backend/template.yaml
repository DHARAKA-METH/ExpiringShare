AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ExpiringShare backend

Parameters:
  UploadBucketName:
    Type: String
    Default: expiringshare-dharaka-lab-20261110
    Description: Existing S3 bucket used for uploaded files

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 3
    MemorySize: 128

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/helloWorld.lambdaHandler
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/createUploadUrl.lambdaHandler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucketName
      Events:
        CreateUploadUrlApi:
          Type: Api
          Properties:
            Path: /uploads
            Method: post

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag

Outputs:
  UploadsBucketName:
    Description: S3 bucket used for file uploads
    Value: !Ref UploadBucketName
