AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ExpiringShare backend

Parameters:
  UploadBucketName:
    Type: String
    Default: expiringshare-dharaka-lab-20261110
    Description: Existing S3 bucket used for uploaded files
  ShareTableName:
    Type: String
    Default: ExpiringShareLinks
    Description: Existing DynamoDB table used for share metadata
  CleanupIndexName:
    Type: String
    Default: CleanupIndex
    Description: Existing DynamoDB GSI used to find records ready for cleanup
  CognitoUserPoolArn:
    Type: String
    Description: Cognito User Pool ARN used by the API authorizer

Globals:
  Api:
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !Ref CognitoUserPoolArn
  Function:
    Runtime: nodejs22.x
    Timeout: 3
    MemorySize: 128

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/helloWorld.lambdaHandler
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /hello
            Method: get
            Auth:
              Authorizer: NONE

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/createUploadUrl.lambdaHandler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
          TABLE_NAME: !Ref ShareTableName
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucketName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ShareTableName}
      Events:
        CreateUploadUrlApi:
          Type: Api
          Properties:
            Path: /uploads
            Method: post

  CompleteUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/completeUpload.lambdaHandler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
          TABLE_NAME: !Ref ShareTableName
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${UploadBucketName}/uploads/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ShareTableName}
      Events:
        CompleteUploadApi:
          Type: Api
          Properties:
            Path: /uploads/{shareId}/complete
            Method: post

  DownloadShareFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/downloadShare.lambdaHandler
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
          TABLE_NAME: !Ref ShareTableName
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${UploadBucketName}/uploads/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ShareTableName}
      Events:
        DownloadShareApi:
          Type: Api
          Properties:
            Path: /shares/{shareId}/download
            Method: post
            Auth:
              Authorizer: NONE

  CleanupExpiredFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/cleanupExpiredFiles.lambdaHandler
      Timeout: 60
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucketName
          TABLE_NAME: !Ref ShareTableName
          CLEANUP_INDEX_NAME: !Ref CleanupIndexName
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${UploadBucketName}/uploads/*
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ShareTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ShareTableName}/index/${CleanupIndexName}

  CleanupSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeCleanupLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CleanupExpiredFilesFunction.Arn

  CleanupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Run ExpiringShare expired-file cleanup hourly
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Target:
        Arn: !GetAtt CleanupExpiredFilesFunction.Arn
        RoleArn: !GetAtt CleanupSchedulerRole.Arn

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag

Outputs:
  UploadsBucketName:
    Description: S3 bucket used for file uploads
    Value: !Ref UploadBucketName
